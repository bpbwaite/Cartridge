[project]

name="Cartridge"
version="0.3.1"
description="Tools for the creation of a simulated physical game library"
requires-python = ">=3.11.9"

dependencies = [
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.92",
    "requests>=2.32.5",
    "img2pdf>=0.6.3",
    "pyserial>=3.5"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 160
skip-magic-trailing-comma = true

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.2.0",
]
